name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pygbag
      - run: |
          mkdir game
          cp "$(ls *.py | head -n1)" game/main.py
          cp *.ogg *.mp3 *.wav game/ 2>/dev/null || true
      - run: python -m pygbag --build game
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: game/build/web/*
